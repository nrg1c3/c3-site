# ينشر فولدر site/ بس على GitHub Pages.
# الملفات الداخلية (BRIEF.md, MISSING.md, CLAUDE.md, PROPOSAL.md, docs/) ما بتتنشرش على الموقع.
# مرة واحدة، قبل أول merge على main: Settings ← Pages ← Source = GitHub Actions
# (لو اتعمل merge قبلها، شغّل الـ workflow يدوي من تبويب Actions ← Run workflow)
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
